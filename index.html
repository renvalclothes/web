<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RENVAL CLOTHES</title>
<meta name="description" content="RENVAL CLOTHES — Wear What's Next.">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  min-height:100%;
}

body{
  background:#050607;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  display:flex;
  justify-content:center;
  padding:18px;
}

.page{
  width:100%;
  max-width:520px;
  min-height:calc(100vh - 36px);

  position:relative;
  overflow:hidden;

  border:1px solid rgba(255,255,255,.09);
  border-radius:24px;

  background:
    radial-gradient(
      circle at 50% 12%,
      rgba(90,150,180,.09),
      transparent 28%
    ),
    linear-gradient(
      145deg,
      #161719 0%,
      #08090a 48%,
      #111214 100%
    );

  box-shadow:0 25px 80px rgba(0,0,0,.65);

  padding:72px 24px 28px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.page:before{
  content:"";
  position:absolute;
  inset:-20%;

  background:
    linear-gradient(
      125deg,
      transparent 30%,
      rgba(255,255,255,.025) 42%,
      transparent 55%
    );

  transform:rotate(-5deg);
  pointer-events:none;
}


/* BRAND */

.brand{
  position:relative;
  z-index:1;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:46px;
  font-weight:600;

  letter-spacing:13px;
  margin-left:13px;

  line-height:1.05;

  text-align:center;

  text-shadow:
    0 2px 18px rgba(255,255,255,.08);
}

.clothes{
  position:relative;
  z-index:1;

  margin-top:12px;

  font-size:12px;
  letter-spacing:9px;

  color:#e4e4e4;

  text-align:center;
}


/* TOP DECORATION */

.decor{
  position:relative;
  z-index:1;

  display:flex;
  align-items:center;

  gap:14px;

  margin:21px 0 13px;
}

.decor i{
  display:block;

  width:72px;
  height:1px;

  background:#9da3a8;
}

.decor b{
  font-size:11px;
  color:#b9c0c5;
}


/* TAGLINE */

.tagline{
  position:relative;
  z-index:1;

  font-family:
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size:30px;
  font-style:italic;

  color:#e9edf0;

  text-align:center;

  margin-bottom:34px;
}


/* SOCIAL LINKS */

.links{
  width:100%;

  position:relative;
  z-index:1;

  display:flex;
  flex-direction:column;

  gap:13px;
}

.social{
  width:100%;
  min-height:62px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:15px;

  background:rgba(255,255,255,.035);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:13px;

  text-decoration:none;
  color:#fff;

  font-size:13px;
  font-weight:700;

  letter-spacing:2.4px;

  transition:.22s ease;
}

.social:hover{
  transform:translateY(-2px);

  border-color:
    rgba(180,210,225,.55);

  background:
    rgba(255,255,255,.07);
}

.icon{
  width:25px;
  height:25px;
  display:block;
}


/* FOOTER */

.footer{
  margin-top:auto;

  padding-top:38px;

  position:relative;
  z-index:1;

  color:#777;

  font-size:10px;
  letter-spacing:4px;
}


/* MOBILE */

@media(max-width:430px){

  body{
    padding:9px;
  }

  .page{
    min-height:calc(100vh - 18px);
    padding:58px 18px 24px;
  }

  .brand{
    font-size:38px;
    letter-spacing:10px;
    margin-left:10px;
  }

  .clothes{
    font-size:11px;
    letter-spacing:7px;
  }

  .decor i{
    width:58px;
  }

  .tagline{
    font-size:27px;
  }
}

</style>
</head>
